<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#apiBg)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="38" rx="12" fill="#1e293b" />
  <circle cx="45" cy="39" r="6" fill="#ef4444" />
  <circle cx="65" cy="39" r="6" fill="#f59e0b" />
  <circle cx="85" cy="39" r="6" fill="#10b981" />
  <text x="300" y="44" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">FastAPI Swagger UI - /api/v1/docs</text>

  <!-- Main API Endpoint Cards -->
  <g transform="translate(45, 75)">
    <!-- Endpoint 1: POST /api/v1/auth/login -->
    <rect width="510" height="48" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" />
    <rect x="12" y="11" width="60" height="26" rx="4" fill="#059669" />
    <text x="42" y="28" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POST</text>
    <text x="85" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">/api/v1/auth/jwt/token</text>
    <text x="420" y="28" fill="#10b981" font-family="monospace" font-size="11">200 OK • 12ms</text>

    <!-- Endpoint 2: GET /api/v1/users/me -->
    <g transform="translate(0, 58)">
      <rect width="510" height="48" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <rect x="12" y="11" width="60" height="26" rx="4" fill="#0284c7" />
      <text x="42" y="28" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">GET</text>
      <text x="85" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">/api/v1/tasks/analytics</text>
      <text x="420" y="28" fill="#38bdf8" font-family="monospace" font-size="11">200 OK • 8ms</text>
    </g>

    <!-- Endpoint 3: POST /api/v1/tasks/predict -->
    <g transform="translate(0, 116)">
      <rect width="510" height="48" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
      <rect x="12" y="11" width="60" height="26" rx="4" fill="#4f46e5" />
      <text x="42" y="28" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">POST</text>
      <text x="85" y="28" fill="#e2e8f0" font-family="monospace" font-size="12">/api/v1/ml/inference/async</text>
      <text x="420" y="28" fill="#818cf8" font-family="monospace" font-size="11">202 Accepted • Async</text>
    </g>

    <!-- Bottom Tech Specs -->
    <g transform="translate(0, 175)">
      <rect width="510" height="50" rx="6" fill="#1e293b" />
      <text x="20" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">ARCHITECTURE SPECS:</text>
      <text x="20" y="38" fill="#38bdf8" font-family="monospace" font-size="11">SQLAlchemy Async Engine</text>
      <text x="200" y="38" fill="#a78bfa" font-family="monospace" font-size="11">PostgreSQL + Redis Cache</text>
      <text x="380" y="38" fill="#34d399" font-family="monospace" font-size="11">Dockerized • 98% Tests</text>
    </g>
  </g>
</svg>

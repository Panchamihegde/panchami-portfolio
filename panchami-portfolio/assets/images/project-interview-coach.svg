<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="coachBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d1f" />
      <stop offset="100%" stop-color="#2a0845" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#coachBg)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#0d111e" stroke="#2e1065" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="38" rx="12" fill="#17172c" />
  <circle cx="45" cy="39" r="6" fill="#ef4444" />
  <circle cx="65" cy="39" r="6" fill="#f59e0b" />
  <circle cx="85" cy="39" r="6" fill="#10b981" />
  <text x="300" y="44" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">Multi-Agent AI Interview Coach • React + FastAPI + Hugging Face</text>

  <!-- Left Side: Autonomous Multi-Agent Hierarchy -->
  <g transform="translate(45, 75)">
    <rect width="210" height="240" rx="10" fill="#141829" stroke="#818cf8" stroke-width="1" />
    <text x="105" y="26" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">COLLABORATIVE AI AGENTS</text>

    <!-- Agent 1: Interviewer Agent -->
    <g transform="translate(15, 42)">
      <rect width="180" height="48" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="25" cy="24" r="14" fill="#4338ca" />
      <text x="25" y="29" fill="#e0e7ff" font-family="sans-serif" font-size="12" text-anchor="middle">🎯</text>
      <text x="48" y="20" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="700">Interviewer Agent</text>
      <text x="48" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9">Dynamic Qs from Resume/JD</text>
    </g>

    <!-- Agent 2: Evaluator Agent -->
    <g transform="translate(15, 102)">
      <rect width="180" height="48" rx="6" fill="#1e1b4b" stroke="#a855f7" stroke-width="1" />
      <circle cx="25" cy="24" r="14" fill="#7e22ce" />
      <text x="25" y="29" fill="#f3e8ff" font-family="sans-serif" font-size="12" text-anchor="middle">⚖️</text>
      <text x="48" y="20" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="700">Evaluator Agent</text>
      <text x="48" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9">Answer Scoring &amp; Depth Check</text>
    </g>

    <!-- Agent 3: Feedback Coach Agent -->
    <g transform="translate(15, 162)">
      <rect width="180" height="48" rx="6" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="25" cy="24" r="14" fill="#0369a1" />
      <text x="25" y="29" fill="#e0f2fe" font-family="sans-serif" font-size="12" text-anchor="middle">📊</text>
      <text x="48" y="20" fill="#f8fafc" font-family="sans-serif" font-size="10.5" font-weight="700">Feedback Coach</text>
      <text x="48" y="34" fill="#94a3b8" font-family="sans-serif" font-size="9">Actionable Tips &amp; Confidence</text>
    </g>
  </g>

  <!-- Right Side: Interview Session Dialogue & Evaluation -->
  <g transform="translate(275, 75)">
    <rect width="280" height="240" rx="10" fill="#141829" stroke="#334155" stroke-width="1" />
    <text x="20" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Simulated Interview &amp; Feedback</text>

    <!-- AI Agent Question Bubble -->
    <rect x="15" y="42" width="250" height="52" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="25" y="60" fill="#a5b4fc" font-family="sans-serif" font-size="9.5" font-weight="700">Interviewer AI (Python &amp; System Design):</text>
    <text x="25" y="76" fill="#f1f5f9" font-family="sans-serif" font-size="9">"How do you handle async requests and DB pooling in FastAPI?"</text>

    <!-- Candidate Response Bubble -->
    <rect x="35" y="104" width="230" height="38" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="0.8" />
    <text x="45" y="120" fill="#38bdf8" font-family="sans-serif" font-size="9" font-weight="600">Candidate Response:</text>
    <text x="45" y="132" fill="#cbd5e1" font-family="sans-serif" font-size="8.5">"Using Asyncpg connection pool with lifespan context..."</text>

    <!-- Evaluation Card Bottom -->
    <rect x="15" y="152" width="250" height="72" rx="6" fill="#090d16" stroke="#10b981" stroke-width="1" />
    <text x="25" y="170" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="700">✓ Evaluator Feedback (Score: 9.2/10)</text>
    <text x="25" y="188" fill="#e2e8f0" font-family="sans-serif" font-size="9">Technical Clarity: Strong • STAR Method: 90%</text>
    <text x="25" y="204" fill="#94a3b8" font-family="sans-serif" font-size="8.5">Hugging Face Transformers evaluation completed in 410ms</text>
  </g>
</svg>

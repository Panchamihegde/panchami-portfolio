<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#ragBg)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
  
  <!-- Window title bar -->
  <rect x="20" y="20" width="560" height="38" rx="12" fill="#1f2937" />
  <circle cx="45" cy="39" r="6" fill="#ef4444" />
  <circle cx="65" cy="39" r="6" fill="#f59e0b" />
  <circle cx="85" cy="39" r="6" fill="#10b981" />
  <text x="300" y="44" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">documind-rag-pipeline.py</text>

  <!-- Left Side: Vector DB / Document Ingestion -->
  <g transform="translate(45, 80)">
    <rect width="180" height="230" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 2" />
    <text x="90" y="30" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">📄 Document Ingestion</text>
    
    <rect x="20" y="50" width="140" height="24" rx="4" fill="#334155" />
    <text x="30" y="66" fill="#e2e8f0" font-family="monospace" font-size="11">PDF Parser</text>
    
    <rect x="20" y="85" width="140" height="24" rx="4" fill="#334155" />
    <text x="30" y="101" fill="#e2e8f0" font-family="monospace" font-size="11">RecursiveChunker</text>
    
    <rect x="20" y="120" width="140" height="24" rx="4" fill="#334155" />
    <text x="30" y="136" fill="#38bdf8" font-family="monospace" font-size="11">Vector Embedding</text>
    
    <rect x="20" y="160" width="140" height="42" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" />
    <text x="90" y="180" fill="#c084fc" font-family="monospace" font-size="10" text-anchor="middle">ChromaDB Store</text>
    <text x="90" y="194" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Cosine Similarity</text>
  </g>

  <!-- Connecting arrows -->
  <path d="M 235, 195 L 285, 195" stroke="url(#accentGlow)" stroke-width="2.5" stroke-dasharray="5 3" />
  <polygon points="285,190 295,195 285,200" fill="#818cf8" />

  <!-- Right Side: LLM Generation & Query Window -->
  <g transform="translate(305, 80)">
    <rect width="250" height="230" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="125" y="30" fill="#a78bfa" font-family="system-ui, sans-serif" font-weight="700" font-size="13" text-anchor="middle">⚡ RAG Query Interface</text>

    <!-- Query message bubble -->
    <rect x="15" y="50" width="220" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="25" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">User Query:</text>
    <text x="25" y="82" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">"Summarize policy changes in Sec 4.2"</text>

    <!-- AI Response Bubble -->
    <rect x="15" y="105" width="220" height="85" rx="6" fill="#172554" stroke="#38bdf8" stroke-width="1" />
    <text x="25" y="125" fill="#38bdf8" font-family="monospace" font-size="10">LLM Response (Source Cited):</text>
    <text x="25" y="145" fill="#e2e8f0" font-family="sans-serif" font-size="10">"Section 4.2 updates the retention</text>
    <text x="25" y="160" fill="#e2e8f0" font-family="sans-serif" font-size="10">policy to 90 days with encryption..."</text>
    <text x="25" y="180" fill="#34d399" font-family="monospace" font-size="9">✓ Grounded: 99.4% confidence</text>

    <!-- Latency / Token metrics -->
    <rect x="15" y="200" width="220" height="20" rx="4" fill="#0f172a" />
    <text x="25" y="214" fill="#64748b" font-family="monospace" font-size="9">Latency: 280ms | LangChain + FastAPI</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="ragBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="gaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#ragBg)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5" />
  
  <!-- Window title bar -->
  <rect x="20" y="20" width="560" height="38" rx="12" fill="#1f2937" />
  <circle cx="45" cy="39" r="6" fill="#ef4444" />
  <circle cx="65" cy="39" r="6" fill="#f59e0b" />
  <circle cx="85" cy="39" r="6" fill="#10b981" />
  <text x="300" y="44" fill="#9ca3af" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">ResumAI • AI Resume Analyzer &amp; ATS Checker</text>

  <!-- Left Side: ATS Score & Analysis -->
  <g transform="translate(45, 75)">
    <rect width="210" height="240" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    
    <text x="105" y="28" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">ATS COMPATIBILITY SCORE</text>
    
    <!-- Circular gauge representation -->
    <circle cx="105" cy="85" r="42" fill="none" stroke="#334155" stroke-width="8" />
    <circle cx="105" cy="85" r="42" fill="none" stroke="url(#gaugeGrad)" stroke-width="8" stroke-dasharray="264" stroke-dashoffset="35" stroke-linecap="round" transform="rotate(-90 105 85)" />
    <text x="105" y="86" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="24" font-weight="800" text-anchor="middle">88%</text>
    <text x="105" y="103" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">HIGH MATCH</text>

    <!-- PyPDF2 & FastAPI status pills -->
    <rect x="20" y="145" width="170" height="26" rx="6" fill="#0f172a" />
    <text x="30" y="162" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="10">📄 PyPDF2 Text Extraction</text>

    <rect x="20" y="180" width="170" height="26" rx="6" fill="#0f172a" />
    <text x="30" y="197" fill="#818cf8" font-family="'Fira Code', monospace" font-size="10">⚡ FastAPI Resume Parser</text>
  </g>

  <!-- Right Side: Matched & Missing Skills Breakdown -->
  <g transform="translate(275, 75)">
    <rect width="280" height="240" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
    
    <text x="20" y="28" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Skill Match &amp; Improvement Insights</text>
    
    <!-- Matched Skills -->
    <text x="20" y="55" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="600">✓ Matched Skills (Detected)</text>
    <g transform="translate(20, 65)">
      <rect x="0" y="0" width="55" height="22" rx="4" fill="#065f46" />
      <text x="27" y="15" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">Python</text>

      <rect x="62" y="0" width="58" height="22" rx="4" fill="#065f46" />
      <text x="91" y="15" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">FastAPI</text>

      <rect x="127" y="0" width="45" height="22" rx="4" fill="#065f46" />
      <text x="149" y="15" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">SQL</text>

      <rect x="179" y="0" width="55" height="22" rx="4" fill="#065f46" />
      <text x="206" y="15" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">REST API</text>
    </g>

    <!-- Missing Skills -->
    <text x="20" y="115" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">⚠ Missing Keywords (Recommended)</text>
    <g transform="translate(20, 125)">
      <rect x="0" y="0" width="60" height="22" rx="4" fill="#450a0a" />
      <text x="30" y="15" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">Docker</text>

      <rect x="67" y="0" width="80" height="22" rx="4" fill="#450a0a" />
      <text x="107" y="15" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">Unit Testing</text>

      <rect x="154" y="0" width="65" height="22" rx="4" fill="#450a0a" />
      <text x="186" y="15" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">CI/CD</text>
    </g>

    <!-- AI Suggestion Box -->
    <rect x="15" y="165" width="250" height="60" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="0.8" />
    <text x="25" y="185" fill="#818cf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">💡 ATS Improvement Suggestion:</text>
    <text x="25" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">"Quantify impact with metrics and integrate</text>
    <text x="25" y="216" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9.5">target keywords in the experience section."</text>
  </g>
</svg>

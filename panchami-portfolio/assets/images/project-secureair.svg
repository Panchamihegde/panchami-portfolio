<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="secBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923" />
      <stop offset="100%" stop-color="#003554" />
    </linearGradient>
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#secBg)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#031b29" stroke="#0582ca" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="38" rx="12" fill="#002b42" />
  <circle cx="45" cy="39" r="6" fill="#ef4444" />
  <circle cx="65" cy="39" r="6" fill="#f59e0b" />
  <circle cx="85" cy="39" r="6" fill="#10b981" />
  <text x="300" y="44" fill="#00a6fb" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">SecureAir • Wi-Fi Honeypot &amp; Rogue AP Detector (Raspberry Pi)</text>

  <!-- Left: Live Radio Frequency Scanner & Radar -->
  <g transform="translate(45, 75)">
    <rect width="230" height="240" rx="10" fill="#001824" stroke="#0582ca" stroke-width="1" />
    <text x="115" y="26" fill="#00a6fb" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">📡 AIR MONITORING SCANNER</text>

    <!-- Radar circles -->
    <circle cx="115" cy="115" r="70" fill="none" stroke="#003554" stroke-width="1" />
    <circle cx="115" cy="115" r="48" fill="none" stroke="#006494" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="115" cy="115" r="25" fill="none" stroke="#0582ca" stroke-width="1" />
    <circle cx="115" cy="115" r="4" fill="#00a6fb" />

    <!-- Radar crosshair -->
    <line x1="45" y1="115" x2="185" y2="115" stroke="#003554" stroke-width="0.8" />
    <line x1="115" y1="45" x2="115" y2="185" stroke="#003554" stroke-width="0.8" />

    <!-- Rogue AP Blip in Red -->
    <circle cx="145" cy="85" r="6" fill="#ef4444" />
    <circle cx="145" cy="85" r="12" fill="none" stroke="#ef4444" stroke-width="1" opacity="0.7" />
    <text x="145" y="72" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">ROGUE AP</text>

    <!-- Legitimate AP Blip in Green -->
    <circle cx="85" cy="140" r="5" fill="#10b981" />
    <text x="85" y="155" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="8.5" text-anchor="middle">Corp_WiFi</text>

    <!-- Raspberry Pi Hardware tag -->
    <rect x="25" y="195" width="180" height="26" rx="4" fill="#002b42" />
    <text x="115" y="212" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5" text-anchor="middle">🍓 Raspberry Pi 4 • Scapy Engine</text>
  </g>

  <!-- Right: Real-Time Event Log & Telemetry -->
  <g transform="translate(295, 75)">
    <rect width="260" height="240" rx="10" fill="#001824" stroke="#0582ca" stroke-width="1" />
    <text x="20" y="26" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="700">NETWORK SECURITY TELEMETRY</text>

    <!-- Alert Box: Rogue AP Detected -->
    <rect x="15" y="40" width="230" height="58" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1" />
    <text x="25" y="58" fill="#fecaca" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🚨 ALERT: Evil Twin / Rogue AP</text>
    <text x="25" y="74" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="8.5">SSID: "Free_Airport_WiFi" [Spoofed]</text>
    <text x="25" y="88" fill="#fca5a5" font-family="'Fira Code', monospace" font-size="8.5">BSSID: C4:70:AB:91:2E:3D • Signal: -42dBm</text>

    <!-- Live Honeypot Status -->
    <rect x="15" y="108" width="230" height="52" rx="6" fill="#002b42" stroke="#0582ca" stroke-width="0.8" />
    <text x="25" y="126" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">🛡️ Honeypot Trap Active</text>
    <text x="25" y="142" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Capturing probe requests &amp; beacon anomalies</text>
    <text x="25" y="153" fill="#34d399" font-family="'Fira Code', monospace" font-size="8">Status: Normalizing traffic stream</text>

    <!-- Flask Dashboard API status -->
    <rect x="15" y="170" width="230" height="55" rx="6" fill="#031b29" stroke="#003554" stroke-width="1" />
    <text x="25" y="188" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Flask Web Dashboard:</text>
    <text x="25" y="202" fill="#10b981" font-family="'Fira Code', monospace" font-size="8.5">● WebSocket live feed connected (0.2s)</text>
    <text x="25" y="215" fill="#e2e8f0" font-family="sans-serif" font-size="8.5">Final Year Computer Engineering Project</text>
  </g>
</svg>

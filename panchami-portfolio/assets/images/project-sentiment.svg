<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="sentBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#sentBg)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#0b0f19" stroke="#1f293d" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="38" rx="12" fill="#131d31" />
  <circle cx="45" cy="39" r="6" fill="#ef4444" />
  <circle cx="65" cy="39" r="6" fill="#f59e0b" />
  <circle cx="85" cy="39" r="6" fill="#10b981" />
  <text x="300" y="44" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">marketpulse-nlp-stream.py</text>

  <!-- Left: Pipeline Steps -->
  <g transform="translate(40, 75)">
    <rect width="180" height="235" rx="8" fill="#111c33" stroke="#253556" stroke-width="1" />
    <text x="90" y="26" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">PIPELINE STAGES</text>

    <g transform="translate(15, 40)">
      <circle cx="10" cy="10" r="10" fill="#38bdf8" />
      <text x="10" y="14" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">1</text>
      <text x="30" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="11">Data Scraping (News/API)</text>
    </g>

    <g transform="translate(15, 80)">
      <circle cx="10" cy="10" r="10" fill="#818cf8" />
      <text x="10" y="14" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">2</text>
      <text x="30" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="11">NLP Preprocessing</text>
    </g>

    <g transform="translate(15, 120)">
      <circle cx="10" cy="10" r="10" fill="#ec4899" />
      <text x="10" y="14" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">3</text>
      <text x="30" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="11">VADER / FinBERT Scoring</text>
    </g>

    <g transform="translate(15, 160)">
      <circle cx="10" cy="10" r="10" fill="#10b981" />
      <text x="10" y="14" fill="#0f172a" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">4</text>
      <text x="30" y="14" fill="#e2e8f0" font-family="sans-serif" font-size="11">Trend Correlation Engine</text>
    </g>
    
    <rect x="15" y="195" width="150" height="24" rx="4" fill="#1e293b" />
    <text x="90" y="211" fill="#38bdf8" font-family="monospace" font-size="9" text-anchor="middle">Automated Cron: Every 1 hr</text>
  </g>

  <!-- Right: Chart & Sentiment Indicator -->
  <g transform="translate(240, 75)">
    <rect width="320" height="235" rx="8" fill="#111c33" stroke="#253556" stroke-width="1" />
    <text x="25" y="28" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Sentiment Score vs Trend</text>
    <rect x="235" y="14" width="70" height="20" rx="10" fill="#065f46" />
    <text x="270" y="28" fill="#6ee7b7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">+0.78 Bullish</text>

    <!-- Chart Grid -->
    <path d="M 25,180 L 295,180" stroke="#1e293b" stroke-width="1" />
    <path d="M 25,130 L 295,130" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />
    <path d="M 25,80 L 295,80" stroke="#1e293b" stroke-width="1" stroke-dasharray="3 3" />

    <!-- Chart Area and Line -->
    <path d="M 35,160 Q 75,130 115,145 T 185,100 T 245,70 T 290,55 L 290,180 L 35,180 Z" fill="url(#chartGrad)" />
    <path d="M 35,160 Q 75,130 115,145 T 185,100 T 245,70 T 290,55" fill="none" stroke="#38bdf8" stroke-width="2.5" />

    <!-- Data points -->
    <circle cx="115" cy="145" r="4" fill="#38bdf8" />
    <circle cx="185" cy="100" r="4" fill="#818cf8" />
    <circle cx="245" cy="70" r="4" fill="#c084fc" />
    <circle cx="290" cy="55" r="5" fill="#34d399" />

    <!-- Legend bar bottom -->
    <rect x="20" y="195" width="280" height="26" rx="4" fill="#0b0f19" />
    <text x="35" y="212" fill="#94a3b8" font-family="monospace" font-size="10">Articles: 1,240</text>
    <text x="145" y="212" fill="#94a3b8" font-family="monospace" font-size="10">Accuracy: 88.2%</text>
    <text x="240" y="212" fill="#38bdf8" font-family="monospace" font-size="10">Pandas + NLP</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="visBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" rx="16" fill="url(#visBg)" />
  <rect x="20" y="20" width="560" height="320" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Window Header -->
  <rect x="20" y="20" width="560" height="38" rx="12" fill="#1e293b" />
  <circle cx="45" cy="39" r="6" fill="#ef4444" />
  <circle cx="65" cy="39" r="6" fill="#f59e0b" />
  <circle cx="85" cy="39" r="6" fill="#10b981" />
  <text x="300" y="44" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="12" text-anchor="middle">vision-guard-yolo8.py • 34 FPS</text>

  <!-- Video Viewport Simulator -->
  <g transform="translate(45, 75)">
    <rect width="360" height="235" rx="8" fill="#020617" stroke="#334155" stroke-width="1" />
    
    <!-- Video grid overlay -->
    <line x1="0" y1="117" x2="360" y2="117" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" />
    <line x1="180" y1="0" x2="180" y2="235" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4 4" />

    <!-- Object 1: Detected person -->
    <rect x="40" y="40" width="90" height="150" rx="4" fill="none" stroke="#10b981" stroke-width="2" />
    <rect x="40" y="25" width="90" height="16" rx="2" fill="#10b981" />
    <text x="45" y="37" fill="#022c22" font-family="monospace" font-size="10" font-weight="700">Person: 0.94</text>

    <!-- Object 2: Detected equipment -->
    <rect x="180" y="90" width="130" height="95" rx="4" fill="none" stroke="#38bdf8" stroke-width="2" />
    <rect x="180" y="75" width="105" height="16" rx="2" fill="#38bdf8" />
    <text x="185" y="87" fill="#082f49" font-family="monospace" font-size="10" font-weight="700">Safety Gear: 0.89</text>

    <!-- Scan Line -->
    <line x1="10" y1="130" x2="350" y2="130" stroke="#34d399" stroke-width="1.5" opacity="0.6" />
    <text x="15" y="222" fill="#10b981" font-family="monospace" font-size="10">● LIVE FEED [CAMERA 01] - REALTIME DETECT</text>
  </g>

  <!-- Stats Panel Right -->
  <g transform="translate(420, 75)">
    <rect width="135" height="235" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="67" y="25" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">ANALYTICS</text>
    
    <rect x="12" y="40" width="111" height="45" rx="6" fill="#0f172a" />
    <text x="20" y="58" fill="#94a3b8" font-family="sans-serif" font-size="9">Total Detections</text>
    <text x="20" y="77" fill="#10b981" font-family="monospace" font-size="16" font-weight="700">1,428</text>

    <rect x="12" y="95" width="111" height="45" rx="6" fill="#0f172a" />
    <text x="20" y="113" fill="#94a3b8" font-family="sans-serif" font-size="9">Inference Speed</text>
    <text x="20" y="132" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="700">28.4 ms</text>

    <rect x="12" y="150" width="111" height="45" rx="6" fill="#0f172a" />
    <text x="20" y="168" fill="#94a3b8" font-family="sans-serif" font-size="9">Model Architecture</text>
    <text x="20" y="186" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="600">YOLOv8 + Torch</text>

    <rect x="12" y="203" width="111" height="20" rx="4" fill="#047857" />
    <text x="67" y="217" fill="#ecfdf5" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">STREAM ACTIVE</text>
  </g>
</svg>
